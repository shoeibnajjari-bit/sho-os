name: Deploy SHO OS to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Avoid two deployments writing to the same FTP directory at once.
concurrency:
  group: infinityfree-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Upload website files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PHP, JavaScript and manifest syntax
        run: |
          php -l index.php
          php -l export.php
          php -l backup.php
          php -l restore.php
          php -l market.php
          php -l pricing.php
          php -l install.php
          php -l config.example.php
          node --check assets/app.js
          node --check sw.js
          python -m json.tool manifest.webmanifest > /dev/null

      - name: Validate deployment secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          # Keep deployment conservative: do not delete remote files automatically.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/config.php
            **/install.php
            **/.htaccess
            **/.env
            **/.env.*
            **/node_modules/**
